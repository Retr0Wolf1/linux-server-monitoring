
global:

  scrape_interval: 15s

  evaluation_interval: 15s



alerting:

  alertmanagers:

    - static_configs:

        - targets: []



rule_files: []



scrape_configs:

  - job_name: "prometheus"

    static_configs:

      - targets: ["localhost:9090"]



  - job_name: "node_exporter"

    static_configs:

      - targets:

        - "localhost:9100"




  - job_name: "mikrotik"

    static_configs:

      - targets: ["192.168.151.128"]

    metrics_path: /snmp

    params:

      module: [mikrotik]

    relabel_configs:

      - source_labels: [__address__]

        target_label: __param_target

      - source_labels: [__param_target]

        target_label: instance

      - target_label: __address__

        replacement: localhost:9116

